<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SABOOT Suite — SmartLabel SKU+ & AWB Proof Studio</title>
    <meta name="description" content="Local-first label cropper, barcode-verified packing video recorder and claim-deadline radar for Indian e-commerce sellers. ₹0 server cost." />
    <link rel="canonical" href="https://saboot.in/" />
    <meta name="theme-color" content="#0a0c12" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <script>
      /* Theme boot — resolves stored → system and sets the class before first paint. */
      (function () {
        try {
          var t = localStorage.getItem('saboot_theme') || localStorage.getItem('claimproof_theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          var root = document.documentElement;
          root.classList.add(t);
          root.style.colorScheme = t;
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <style>
      html { background: #0a0c12; }
      html.light { background: #f6f7f9; }
      body { margin: 0; }
      #root { min-height: 100vh; }
    </style>
  </head>
  <body>
    <noscript>
      <h1>SABOOT Suite — SmartLabel SKU+ &amp; AWB Proof Studio</h1>
      <p>Local-first shipping label studio and AWB packing video recorder for Indian marketplace sellers.</p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
