<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>404 — Page Not Found · SABOOT Suite</title>
    <meta name="description" content="The requested page could not be found on SABOOT." />
    <link rel="canonical" href="https://saboot.in/404.html" />
    <meta name="theme-color" content="#0B0C0E" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FAF8F4" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <!-- Typography: Self-hosted with size-adjusted fallbacks -->
    <style>
      @font-face {
        font-family: 'Inter-fallback';
        src: local('Arial');
        ascent-override: 90%;
        descent-override: 22.5%;
        line-gap-override: 0%;
        size-adjust: 107%;
        font-display: swap;
      }
      @font-face {
        font-family: 'Fraunces-fallback';
        src: local('Georgia'), local('Times New Roman'), local('serif');
        ascent-override: 90%;
        descent-override: 25%;
        line-gap-override: 0%;
        size-adjust: 100%;
        font-display: swap;
      }
      @font-face {
        font-family: 'JetBrainsMono-fallback';
        src: local('Courier New'), local('monospace');
        ascent-override: 90%;
        descent-override: 20%;
        line-gap-override: 0%;
        size-adjust: 98%;
        font-display: swap;
      }
    </style>
<style>
      :root {
        --cp-bg: #0B0C0E;
        --cp-surface: #121316;
        --cp-surface-2: #181A1F;
        --cp-surface-3: #22252B;
        --cp-line: rgba(232, 226, 212, 0.10);
        --cp-linestrong: rgba(232, 226, 212, 0.20);
        --cp-text: #F2EFE8;
        --cp-text-2: #A9A59B;
        --cp-text-3: #8F8B82;
        --cp-accent: #D4B483;
        --cp-accent-text: #E3C896;
        --cp-accentsolid: #C9A45C;
        --cp-accent-strong: #B8923F;
        --cp-accentsoft: rgba(212, 180, 131, 0.12);
        --cp-on-accent: #14110A;
        --cp-successtext: #6CC29A;
        --cp-warn-text: #E39A4F;
        --cp-danger-text: #E88A82;
        --cp-infotext: #9DB1C6;
        --cp-glass: rgba(18, 19, 22, 0.88);
        --cp-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
        --cp-hero-1: rgba(201, 164, 92, 0.07);
        --cp-hero2: rgba(157, 177, 198, 0.04);

        --cp-line-bright: var(--cp-linestrong);
        --cp-text-muted: var(--cp-text-2);
        --cp-text-subtle: var(--cp-text-3);
        --cp-accent-hover: var(--cp-accent-strong);
        --cp-warn: var(--cp-warn-text);
      }
      @media (prefers-color-scheme: light) {
        :root {
          --cp-bg: #FAF8F4;
          --cp-surface: #FFFFFF;
          --cp-surface-2: #F3F0EA;
          --cp-surface-3: #E8E3DA;
          --cp-line: rgba(21, 19, 15, 0.09);
          --cp-linestrong: rgba(21, 19, 15, 0.18);
          --cp-text: #15130F;
          --cp-text-2: #55504A;
          --cp-text-3: #6B655D;
          --cp-accent: #9A7428;
          --cp-accent-text: #7A5A1B;
          --cp-accentsolid: #7A5A1B;
          --cp-accent-strong: #5F4512;
          --cp-accentsoft: rgba(154, 116, 40, 0.10);
          --cp-on-accent: #FFFFFF;
          --cp-successtext: #2F7A55;
          --cp-warn-text: #9A5A12;
          --cp-danger-text: #B3382F;
          --cp-infotext: #476178;
          --cp-glass: rgba(255, 255, 255, 0.92);
          --cp-shadow: 0 0 0 1px rgba(21, 19, 15, 0.03), 0 1px 2px rgba(21, 19, 15, 0.04), 0 8px 24px -10px rgba(21, 19, 15, 0.10);
          --cp-hero-1: rgba(154, 116, 40, 0.07);
          --cp-hero2: rgba(71, 97, 120, 0.04);
        }
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: var(--cp-bg);
        color: var(--cp-text);
        font-family: 'Inter Variable', 'Inter', 'Inter-fallback', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        position: relative;
        overflow-x: hidden;
      }
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background-image:
          radial-gradient(ellipse 60% 40% at 50% 0%, var(--cp-hero-1) 0%, transparent 70%),
          radial-gradient(circle 1px at center, var(--cp-line) 1px, transparent 1px);
        background-size: 100% 100%, 44px 44px;
        opacity: 0.6;
        pointer-events: none;
        z-index: 0;
      }
      .card {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 32rem;
        background: var(--cp-glass);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--cp-line);
        border-radius: 1.25rem;
        padding: 2.5rem 2rem;
        text-align: center;
        box-shadow: var(--cp-shadow);
      }
      .logo {
        display: inline-flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 2rem;
        text-decoration: none;
      }
      .logo-text {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: 1.15rem;
        color: var(--cp-text);
        letter-spacing: -0.02em;
        line-height: 1;
        text-align: left;
      }
      .logo-text span {
        color: var(--cp-accent);
      }
      .logo-sub {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.55rem;
        text-transform: uppercase;
        letter-spacing: 0.22em;
        color: var(--cp-text-subtle);
        margin-top: 0.25rem;
      }
      .icon-box {
        width: 4rem;
        height: 4rem;
        margin: 0 auto 1.25rem;
        border-radius: 1rem;
        background: var(--cp-accentsoft);
        border: 1px solid var(--cp-linestrong);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--cp-warn);
      }
      .badge {
        display: inline-block;
        padding: 0.25rem 0.6rem;
        font-size: 0.7rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--cp-warn-text);
        background: var(--cp-accentsoft);
        border: 1px solid var(--cp-linestrong);
        border-radius: 0.375rem;
        margin-bottom: 0.75rem;
      }
      h1 {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 1.75rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-bottom: 0.5rem;
        color: var(--cp-text);
      }
      p {
        font-size: 0.875rem;
        color: var(--cp-text-muted);
        line-height: 1.5;
        margin-bottom: 1.25rem;
      }
      .path-box {
        background: var(--cp-surface-2);
        border: 1px solid var(--cp-line);
        border-radius: 0.5rem;
        padding: 0.6rem 0.75rem;
        margin-bottom: 1.75rem;
        text-align: left;
      }
      .path-label {
        font-size: 0.625rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--cp-text-subtle);
        margin-bottom: 0.25rem;
      }
      .path-code {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.75rem;
        color: var(--cp-text-2);
        word-break: break-all;
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      @media (min-width: 480px) {
        .actions {
          flex-direction: row;
          justify-content: center;
        }
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.65rem 1.25rem;
        font-size: 0.875rem;
        font-weight: 600;
        border-radius: 0.75rem;
        text-decoration: none;
        transition: all 0.15s ease;
      }
      .btn-primary {
        background: var(--cp-accentsolid);
        color: var(--cp-on-accent);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
      }
      .btn-primary:hover {
        background: var(--cp-accent-hover);
        transform: translateY(-1px);
      }
      .btn-secondary {
        background: var(--cp-surface-2);
        color: var(--cp-text);
        border: 1px solid var(--cp-line);
      }
      .btn-secondary:hover {
        border-color: var(--cp-line-bright);
        background: var(--cp-surface-3);
        transform: translateY(-1px);
      }
      .support {
        margin-top: 2rem;
        padding-top: 1.25rem;
        border-top: 1px solid var(--cp-line);
        font-size: 0.75rem;
        color: var(--cp-text-subtle);
      }
      .support a {
        color: var(--cp-accent);
        text-decoration: underline;
        text-underline-offset: 3px;
        transition: color 0.15s ease;
      }
      .support a:hover {
        color: var(--cp-accent);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <a href="/" class="logo">
        <svg width="34" height="34" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="64" height="64" rx="14" fill="var(--cp-surface)" stroke="var(--cp-surface-3)" stroke-width="1"/>
          <g stroke="var(--cp-accent)" stroke-width="4.5" stroke-linecap="round">
            <path d="M14 23 V17 a3 3 0 0 1 3 -3 h6"/>
            <path d="M41 14 h6 a3 3 0 0 1 3 3 v6"/>
            <path d="M50 41 v6 a3 3 0 0 1 -3 3 h-6"/>
            <path d="M23 50 h-6 a3 3 0 0 1 -3 -3 v-6"/>
          </g>
          <rect x="23" y="25" width="18" height="14" rx="2.5" stroke="var(--cp-accent-text)" stroke-width="3"/>
          <path d="M35.5 27.5 l-5 4.5 h3.4 l-2.4 4.5 5.6 -5.2 h-3.4 z" fill="var(--cp-accentsolid)"/>
        </svg>
        <div>
          <div class="logo-text">SABOOT<span>.in</span></div>
          <div class="logo-sub">Proof Suite</div>
        </div>
      </a>

      <div class="icon-box">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
      </div>

      <div class="badge">404 Error</div>
      <h1>Page Not Found</h1>
      <p>
        The page or parcel path you requested could not be located.
        It may have been moved, deleted, or the address might be incorrect.
      </p>

      <div class="path-box">
        <div class="path-label">Requested Path</div>
        <div class="path-code" id="requested-path">/</div>
      </div>

      <div class="actions">
        <a href="/" class="btn btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          Go to Overview
        </a>
        <a href="/#labels" class="btn btn-secondary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 7V5a2 2 0 0 1 2-2h2"/>
            <path d="M17 3h2a2 2 0 0 1 2 2v2"/>
            <path d="M21 17v2a2 2 0 0 1-2 2h-2"/>
            <path d="M7 21H5a2 2 0 0 1-2-2v-2"/>
            <rect x="7" y="7" width="10" height="10" rx="1"/>
          </svg>
          Open SmartLabel Studio
        </a>
      </div>

      <div class="support">
        Need assistance with your account or claims?
        <a href="mailto:support@saboot.in?subject=SABOOT%20Support%20Request">Contact Support</a>
      </div>
    </div>

    <script src="/404.js"></script>
  </body>
</html>
