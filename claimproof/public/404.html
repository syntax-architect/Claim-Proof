<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>404 — Page Not Found · ClaimProof Suite</title>
    <meta name="description" content="The requested page could not be found on ClaimProof." />
    <meta name="theme-color" content="#0a0c12" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --cp-bg: #0a0c12;
        --cp-surface: #10131b;
        --cp-surface-2: #171b26;
        --cp-line: rgba(148, 163, 184, 0.12);
        --cp-line-bright: rgba(148, 163, 184, 0.24);
        --cp-text: #edeff5;
        --cp-text-muted: #9aa3b2;
        --cp-text-subtle: #6b7482;
        --cp-accent: #3b82f6;
        --cp-accent-hover: #2563eb;
        --cp-warn: #fbbf24;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: var(--cp-bg);
        color: var(--cp-text);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        position: relative;
        overflow-x: hidden;
      }
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background-image:
          radial-gradient(ellipse 60% 40% at 50% 0%, rgba(59, 130, 246, 0.08) 0%, transparent 70%),
          radial-gradient(circle 1px at center, rgba(148, 163, 184, 0.08) 1px, transparent 1px);
        background-size: 100% 100%, 44px 44px;
        opacity: 0.6;
        pointer-events: none;
        z-index: 0;
      }
      .card {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 32rem;
        background: rgba(16, 19, 27, 0.88);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--cp-line);
        border-radius: 1.25rem;
        padding: 2.5rem 2rem;
        text-align: center;
        box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
      }
      .logo {
        display: inline-flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 2rem;
        text-decoration: none;
      }
      .logo-text {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: 1.15rem;
        color: #ffffff;
        letter-spacing: -0.02em;
        line-height: 1;
        text-align: left;
      }
      .logo-text span {
        color: #60a5fa;
      }
      .logo-sub {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.55rem;
        text-transform: uppercase;
        letter-spacing: 0.22em;
        color: var(--cp-text-subtle);
        margin-top: 0.25rem;
      }
      .icon-box {
        width: 4rem;
        height: 4rem;
        margin: 0 auto 1.25rem;
        border-radius: 1rem;
        background: rgba(251, 191, 36, 0.1);
        border: 1px solid rgba(251, 191, 36, 0.25);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--cp-warn);
      }
      .badge {
        display: inline-block;
        padding: 0.25rem 0.6rem;
        font-size: 0.7rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: #fde68a;
        background: rgba(251, 191, 36, 0.12);
        border: 1px solid rgba(251, 191, 36, 0.3);
        border-radius: 0.375rem;
        margin-bottom: 0.75rem;
      }
      h1 {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 1.75rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-bottom: 0.5rem;
        color: #ffffff;
      }
      p {
        font-size: 0.875rem;
        color: var(--cp-text-muted);
        line-height: 1.5;
        margin-bottom: 1.25rem;
      }
      .path-box {
        background: rgba(23, 27, 38, 0.75);
        border: 1px solid var(--cp-line);
        border-radius: 0.5rem;
        padding: 0.6rem 0.75rem;
        margin-bottom: 1.75rem;
        text-align: left;
      }
      .path-label {
        font-size: 0.625rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--cp-text-subtle);
        margin-bottom: 0.25rem;
      }
      .path-code {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.75rem;
        color: #cbd5e1;
        word-break: break-all;
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      @media (min-width: 480px) {
        .actions {
          flex-direction: row;
          justify-content: center;
        }
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.65rem 1.25rem;
        font-size: 0.875rem;
        font-weight: 600;
        border-radius: 0.75rem;
        text-decoration: none;
        transition: all 0.15s ease;
      }
      .btn-primary {
        background: var(--cp-accent);
        color: #ffffff;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
      }
      .btn-primary:hover {
        background: var(--cp-accent-hover);
        transform: translateY(-1px);
      }
      .btn-secondary {
        background: rgba(23, 27, 38, 0.8);
        color: var(--cp-text);
        border: 1px solid var(--cp-line);
      }
      .btn-secondary:hover {
        border-color: var(--cp-line-bright);
        background: rgba(32, 38, 52, 0.8);
        transform: translateY(-1px);
      }
      .support {
        margin-top: 2rem;
        padding-top: 1.25rem;
        border-top: 1px solid var(--cp-line);
        font-size: 0.75rem;
        color: var(--cp-text-subtle);
      }
      .support a {
        color: #60a5fa;
        text-decoration: underline;
        text-underline-offset: 3px;
        transition: color 0.15s ease;
      }
      .support a:hover {
        color: #93c5fd;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <a href="/" class="logo">
        <svg width="34" height="34" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="64" height="64" rx="14" fill="#10131B" stroke="#1B2432" stroke-width="1"/>
          <g stroke="#3B82F6" stroke-width="4.5" stroke-linecap="round">
            <path d="M14 23 V17 a3 3 0 0 1 3 -3 h6"/>
            <path d="M41 14 h6 a3 3 0 0 1 3 3 v6"/>
            <path d="M50 41 v6 a3 3 0 0 1 -3 3 h-6"/>
            <path d="M23 50 h-6 a3 3 0 0 1 -3 -3 v-6"/>
          </g>
          <rect x="23" y="25" width="18" height="14" rx="2.5" stroke="#93C5FD" stroke-width="3"/>
          <path d="M35.5 27.5 l-5 4.5 h3.4 l-2.4 4.5 5.6 -5.2 h-3.4 z" fill="#FBBF24"/>
        </svg>
        <div>
          <div class="logo-text">ClaimProof<span>.in</span></div>
          <div class="logo-sub">Proof Suite</div>
        </div>
      </a>

      <div class="icon-box">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
      </div>

      <div class="badge">404 Error</div>
      <h1>Page Not Found</h1>
      <p>
        The page or parcel path you requested could not be located.
        It may have been moved, deleted, or the address might be incorrect.
      </p>

      <div class="path-box">
        <div class="path-label">Requested Path</div>
        <div class="path-code" id="requested-path">/</div>
      </div>

      <div class="actions">
        <a href="/" class="btn btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          Go to Overview
        </a>
        <a href="/#labels" class="btn btn-secondary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 7V5a2 2 0 0 1 2-2h2"/>
            <path d="M17 3h2a2 2 0 0 1 2 2v2"/>
            <path d="M21 17v2a2 2 0 0 1-2 2h-2"/>
            <path d="M7 21H5a2 2 0 0 1-2-2v-2"/>
            <rect x="7" y="7" width="10" height="10" rx="1"/>
          </svg>
          Open SmartLabel Studio
        </a>
      </div>

      <div class="support">
        Need assistance with your account or claims?
        <a href="mailto:support@claimproof.in?subject=ClaimProof%20Support%20Request">Contact Support</a>
      </div>
    </div>

    <script>
      (function() {
        var el = document.getElementById('requested-path');
        if (el) {
          var full = window.location.pathname + window.location.search + window.location.hash;
          el.textContent = full || '/';
        }
      })();
    </script>
  </body>
</html>
