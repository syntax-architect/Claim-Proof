    </text>

    <!-- Badge -->
    <rect x="836" y="11" width="32" height="20" rx="4" fill="#3b82f6" fill-opacity="0.2" />
    <text x="842" y="25" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#60a5fa">30s</text>
