    </text>
  </g>

  <!-- Left Side: Warehouse Packing Table Scene Mockup -->
  <g transform="translate(40, 130)">
    <rect width="480" height="320" rx="12" fill="#131722" stroke="#94a3b8" stroke-width="1" stroke-opacity="0.1" />

    <!-- Table surface grid -->
    <line x1="20" y1="260" x2="460" y2="260" stroke="#94a3b8" stroke-width="2" stroke-opacity="0.2" />

    <!-- Corrugated Box on table -->
    <rect x="140" y="160" width="200" height="110" rx="4" fill="#854d0e" stroke="#ca8a04" stroke-width="1.5" />
    <line x1="140" y1="200" x2="340" y2="200" stroke="#713f12" stroke-width="1.5" stroke-dasharray="4 4" />

    <!-- 4x6 Thermal Label on the box -->
    <rect x="175" y="172" width="70" height="90" rx="2" fill="#f8fafc" stroke="#0f172a" stroke-width="1" />
    <!-- Barcode lines on label -->
