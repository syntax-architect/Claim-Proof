<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="vpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e111a" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>
    <linearGradient id="scannerBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ef4444" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="tableLight" cx="40%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="540" rx="16" fill="url(#vpBg)" />
  <rect width="960" height="540" rx="16" fill="url(#tableLight)" />
  <rect x="1" y="1" width="958" height="538" rx="15" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-opacity="0.15" />

  <!-- Station Window Top Chrome -->
  <rect x="0" y="0" width="960" height="42" rx="16" fill="#171b26" />
  <rect x="0" y="24" width="960" height="18" fill="#171b26" />
  <line x1="0" y1="42" x2="960" y2="42" stroke="#94a3b8" stroke-width="1" stroke-opacity="0.1" />

  <!-- Window controls -->
  <circle cx="24" cy="21" r="5" fill="#ef4444" fill-opacity="0.8" />
  <circle cx="40" cy="21" r="5" fill="#fbbf24" fill-opacity="0.8" />
  <circle cx="56" cy="21" r="5" fill="#22c55e" fill-opacity="0.8" />

  <!-- Station Status Bar -->
  <text x="80" y="26" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">SABOOT Station 1</text>
  <rect x="235" y="12" width="60" height="18" rx="4" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.4" />
  <text x="243" y="25" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#60a5fa">DISPATCH</text>

  <rect x="305" y="12" width="70" height="18" rx="4" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="1" stroke-opacity="0.4" />
  <circle cx="317" cy="21" r="3" fill="#ef4444" />
  <text x="326" y="25" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#ef4444">REC 1080p</text>

  <text x="820" y="26" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748b">00:14 / 00:30</text>

  <!-- Burnt-in Live Timestamp Banner -->
  <g transform="translate(30, 60)">
    <rect width="900" height="48" rx="8" fill="#07090e" fill-opacity="0.95" stroke="#fbbf24" stroke-width="1" stroke-opacity="0.4" />
    <!-- Yellow Caution Stripe Bar -->
    <rect x="0" y="0" width="8" height="48" rx="4" fill="#fbbf24" />
    <text x="24" y="20" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#fbbf24" letter-spacing="1">
      VERIFIED UNCUT PROOF · SABOOT
    </text>
    <text x="320" y="20" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ffffff">
      AWB: FMPP0982341201 (FLIPKART)
    </text>
    <text x="640" y="20" font-family="'JetBrains Mono', monospace" font-size="11" fill="#93c5fd">
      ORD: OD3928192831
    </text>
    <text x="24" y="38" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#cbd5e1">
