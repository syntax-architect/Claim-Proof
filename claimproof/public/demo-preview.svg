    <polygon points="240,110 170,190 310,190" fill="url(#scannerBeam)" />

    <!-- Barcode Scanner Gun Silhouette -->
    <g transform="translate(220, 75)">
      <rect x="10" y="10" width="30" height="24" rx="4" fill="#3b82f6" />
      <polygon points="38,20 48,15 48,29" fill="#1e40af" />
      <rect x="5" y="28" width="16" height="35" rx="3" fill="#1e293b" />
      <circle cx="20" cy="22" r="3" fill="#ef4444" />
    </g>

    <text x="20" y="300" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">
