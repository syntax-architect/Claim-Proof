  <!-- Bottom Timeline Scrubber -->
  <g transform="translate(40, 470)">
    <rect width="880" height="42" rx="10" fill="#171b26" stroke="#94a3b8" stroke-width="1" stroke-opacity="0.1" />

    <!-- Play/Pause Button icon -->
    <polygon points="26,16 36,21 26,26" fill="#3b82f6" />

    <!-- Progress track -->
    <rect x="54" y="19" width="670" height="4" rx="2" fill="#334155" />
    <!-- Progress fill 0:14 / 0:30 = ~46% -->
    <rect x="54" y="19" width="310" height="4" rx="2" fill="#3b82f6" />
    <circle cx="364" cy="21" r="5" fill="#60a5fa" />

    <!-- Time label -->
    <text x="740" y="25" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#94a3b8">
