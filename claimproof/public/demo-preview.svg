    <!-- 2x2 Photo Collage Grid -->
    <g transform="translate(20, 56)">
      <!-- Frame 1 -->
      <rect width="164" height="84" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.3" />
      <rect x="8" y="8" width="40" height="14" rx="3" fill="#1e293b" />
      <text x="12" y="19" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#60a5fa">T+0.5s</text>
      <text x="12" y="46" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">AWB Scanned</text>
      <text x="12" y="62" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748b">Verified in IndexedDB</text>

      <!-- Frame 2 -->
      <rect x="176" width="164" height="84" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.3" />
      <rect x="184" y="8" width="40" height="14" rx="3" fill="#1e293b" />
      <text x="188" y="19" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#60a5fa">T+3.0s</text>
      <text x="188" y="46" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Item Condition</text>
      <text x="188" y="62" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748b">Undamaged T-Shirt</text>

      <!-- Frame 3 -->
      <rect y="94" width="164" height="84" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.3" />
      <rect x="8" y="102" width="40" height="14" rx="3" fill="#1e293b" />
      <text x="12" y="113" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#60a5fa">T+6.0s</text>
      <text x="12" y="140" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Sealed In Box</text>
      <text x="12" y="156" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748b">Intact Security Tape</text>

      <!-- Frame 4 -->
      <rect x="176" y="94" width="164" height="84" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.3" />
      <rect x="184" y="102" width="40" height="14" rx="3" fill="#1e293b" />
      <text x="188" y="113" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#60a5fa">T+9.0s</text>
      <text x="188" y="140" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Thermal Label</text>
      <text x="188" y="156" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748b">Affixed &amp; Legible</text>
