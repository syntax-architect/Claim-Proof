    <text x="183" y="210" font-family="'JetBrains Mono', monospace" font-size="6" fill="#0f172a" font-weight="700">FMPP0982341201</text>
    <line x1="183" y1="216" x2="237" y2="216" stroke="#0f172a" stroke-width="0.5" />
    <text x="183" y="224" font-family="'Inter', sans-serif" font-size="5" fill="#0f172a">TSHIRT-BLK-L</text>
    <rect x="183" y="248" width="54" height="8" fill="#0f172a" />
    <text x="186" y="254" font-family="'Inter', sans-serif" font-size="5" fill="#f8fafc" font-weight="700">SKU FOOTER BAR</text>

