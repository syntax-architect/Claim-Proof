    <rect x="14.5" y="14.5" width="35" height="35" rx="6.5" fill="none" stroke="#14110A" stroke-opacity="0.3" stroke-width="1.5"/>
    <path d="M21.5 33 L29 40.5 L44 23" fill="none" stroke="#14110A" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="60" y="33" font-family="'Fraunces Variable', Fraunces, Georgia, 'Times New Roman', serif" font-weight="700" font-size="27" letter-spacing="-0.5" fill="#F2EFE8">SABOOT<tspan fill="#C9A45C">.in</tspan></text>
  <text x="61" y="45" font-family="'JetBrains Mono Variable', 'JetBrains Mono', Consolas, monospace" font-weight="600" font-size="8.5" letter-spacing="3.4" fill="#A9A59B">PROOF SUITE</text>
