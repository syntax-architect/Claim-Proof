<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 196 52" width="196" height="52" role="img" aria-label="SABOOT — Proof Suite">
  <!-- SABOOT Seal lockup: perforated proof stamp + wordmark -->
  <defs>
    <mask id="saboot-stamp-lockup">
      <rect width="64" height="64" fill="black"/>
      <rect x="10" y="10" width="44" height="44" rx="10" fill="white"/>
      <circle cx="23" cy="10" r="3" fill="black"/>
      <circle cx="32" cy="10" r="3" fill="black"/>
      <circle cx="41" cy="10" r="3" fill="black"/>
      <circle cx="23" cy="54" r="3" fill="black"/>
      <circle cx="32" cy="54" r="3" fill="black"/>
      <circle cx="41" cy="54" r="3" fill="black"/>
      <circle cx="10" cy="23" r="3" fill="black"/>
      <circle cx="10" cy="32" r="3" fill="black"/>
      <circle cx="10" cy="41" r="3" fill="black"/>
      <circle cx="54" cy="23" r="3" fill="black"/>
      <circle cx="54" cy="32" r="3" fill="black"/>
      <circle cx="54" cy="41" r="3" fill="black"/>
